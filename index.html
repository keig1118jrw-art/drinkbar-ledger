<html lang="ja">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-display: 'Shippori Mincho', serif;
    --font-body: 'Zen Kaku Gothic New', sans-serif;
    --paper: #F2EAD9;
    --paper-deep: #E8DDC0;
    --card: #FBF8EF;
    --ink: #2B2620;
    --ink-soft: #6B6153;
    --stamp: #B23A2E;
    --stamp-soft: #E3D2B8;
    --moss: #6E7A55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { font-family: var(--font-body); color: var(--ink); }
  input, textarea, button { font-family: var(--font-body); font-size: 16px; }
  #root { min-height: 100vh; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
</style>
</head>

<div id="root"></div>
